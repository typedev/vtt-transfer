[project]
name = "vtt-transfer"
version = "0.1.0"
description = "Transfer VTT (Visual TrueType) hinting sources between versions of a variable TrueType font, with an HTML report of what is left to hint"
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.60",
    "vttcompilepy>=0.0.1.13",
    "brotli>=1.1",
    "skia-pathops>=0.8",
]

[project.scripts]
vtt-transfer = "vtt_transfer.cli:main"
vtt-ship = "vtt_transfer.ship:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vtt_transfer"]
