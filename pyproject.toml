[project]
name = "vtt-transfer"
dynamic = ["version"]
description = "Transfer VTT (Visual TrueType) hinting sources to a new version of a TrueType font, with an HTML report of what is left to hint"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Alexander Lubovenko" }]
requires-python = ">=3.11"
keywords = ["fonts", "truetype", "hinting", "vtt", "visual truetype", "variable fonts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Fonts",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "fonttools>=4.60",
    "vttcompilepy>=0.0.1.13",
    "brotli>=1.1",
    "skia-pathops>=0.8",
]

[project.urls]
Homepage = "https://github.com/typedev/vtt-transfer"
Repository = "https://github.com/typedev/vtt-transfer"
Issues = "https://github.com/typedev/vtt-transfer/issues"

[project.scripts]
vtt-transfer = "vtt_transfer.cli:main"
vtt-ship = "vtt_transfer.ship:main"
vtt-var2static = "vtt_transfer.var2static:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/vtt_transfer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vtt_transfer"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "doc/", "README.md", "LICENSE", "NOTICE.md"]
